services:
  postgres:
    image: postgres:16
    container_name: metro-postgres
    environment:
      POSTGRES_DB: metro_ride
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: metro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/postgres/data.sql:/docker-entrypoint-initdb.d/02-data.sql

  mongodb:
    image: mongo:8
    container_name: metro-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro

volumes:
  postgres_data:
  mongo_data:
